<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Handling Editor</title>
</head>
<body>
    <div class="container" id="app" style="display: none;">
        <div class="header">
            <h1>Editor de Handling</h1>
            <button id="closeBtn">X</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="motor">Motor</button>
            <button class="tab-btn" data-tab="tracao">Tração/Freio</button>
            <button class="tab-btn" data-tab="suspensao">Suspensão</button>
            <button class="tab-btn" data-tab="outros">Danos/Outros</button>
        </div>
        
        <div class="content" id="fieldsContainer"></div>

        <div class="footer">
            <button id="applyBtn" class="btn-apply">Aplicar e Testar</button>
            <div class="footer-actions">
                <button id="resetBtn" class="btn-reset">Resetar</button>
                <button id="exportBtn" class="btn-save">Exportar XML</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
